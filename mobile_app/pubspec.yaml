name: mobile_app
description: Tenant mobile app for the multi-tenant SaaS platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2 # state management
  dio: ^5.7.0 # HTTP client (interceptors for X-Tenant + Bearer)
  shared_preferences: ^2.3.2 # persist tenant slug + JWT token
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
